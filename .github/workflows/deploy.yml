name: Deploy Lambda Functions

on:
  push:
    branches:
      - main
    paths:
      - '**/*.py'
      - 'requirements.txt'
      - 'resorts_config.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-west-2

jobs:
  deploy:
    name: Build and Deploy Lambda Functions
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build API Lambda package
        run: |
          echo "📦 构建 API Lambda 部署包（使用精简依赖）..."
          
          # 清理旧的 package 目录
          rm -rf package
          mkdir -p package
          
          # 安装精简的依赖（API Lambda 不需要 firebase-admin, supabase, beautifulsoup4 等大型包）
          pip install -r requirements-api.txt -t package/
          
          # 只复制 API Lambda 需要的文件
          cp api.py lambda_handler.py config.py db_manager.py models.py share_page.py package/
          cp resorts_config.json package/
          
          # 创建部署包
          cd package
          zip -r ../api-lambda.zip .
          cd ..
          
          echo "✅ API Lambda 包构建完成"
          ls -lh api-lambda.zip
          
          # 显示包大小
          SIZE=$(du -h api-lambda.zip | cut -f1)
          echo "📦 部署包大小: $SIZE"

      - name: Build Collector Lambda package
        run: |
          echo "📦 构建 Collector Lambda 部署包..."
          
          # 清理并重新创建 package 目录
          rm -rf package
          mkdir -p package
          
          # 安装完整依赖（Collector 需要所有依赖）
          pip install -r requirements.txt -t package/
          
          # 复制所有必要的代码文件
          cp config.py db_manager.py models.py normalizer.py failure_tracker.py resort_manager.py s3_uploader.py monitor.py monitor_html.py package/
          cp resorts_config.json package/
          cp -r collectors package/
          cp collector_handler.py package/
          
          echo "✅ Collector Lambda 包构建完成"
          
          # 创建部署包
          cd package
          zip -r ../collector-lambda.zip .
          cd ..
          
          ls -lh collector-lambda.zip
          
          # 显示包大小
          SIZE=$(du -h collector-lambda.zip | cut -f1)
          echo "📦 部署包大小: $SIZE"
          
          # 验证包内容
          echo "📋 验证部署包内容..."
          unzip -l collector-lambda.zip | grep -E "(collector_handler|collectors|resort_manager)" || echo "Warning: missing files"

      - name: Deploy API Lambda
        run: |
          echo "🚀 部署 API Lambda 函数..."
          
          aws lambda update-function-code \
            --function-name resort-data-api \
            --zip-file fileb://api-lambda.zip \
            --region ${{ env.AWS_REGION }}
          
          echo "✅ API Lambda 部署成功"
          
          echo "⏳ 等待 Lambda 更新完成..."
          aws lambda wait function-updated \
            --function-name resort-data-api \
            --region ${{ env.AWS_REGION }} || true
          
          echo "🔧 更新 API Lambda 环境变量 (ADMIN_API_KEY, SUPABASE)..."
          
          # 获取现有环境变量
          EXISTING_ENV=$(aws lambda get-function-configuration \
            --function-name resort-data-api \
            --region ${{ env.AWS_REGION }} \
            --query 'Environment.Variables' \
            --output json)
          
          echo "现有环境变量: $EXISTING_ENV"
          
          # 使用 jq 添加所有需要的环境变量
          UPDATED_ENV=$(echo "$EXISTING_ENV" | jq \
            --arg admin_key "${{ secrets.ADMIN_API_KEY }}" \
            --arg supabase_url "${{ secrets.SUPABASE_URL }}" \
            --arg supabase_key "${{ secrets.SUPABASE_SERVICE_KEY }}" \
            --arg supabase_anon_key "${{ secrets.SUPABASE_ANON_KEY }}" \
            '. + {"ADMIN_API_KEY": $admin_key, "SUPABASE_URL": $supabase_url, "SUPABASE_SERVICE_KEY": $supabase_key, "SUPABASE_ANON_KEY": $supabase_anon_key}')
          
          echo "更新后的环境变量: $UPDATED_ENV"
          
          # 写入临时文件
          echo "{\"Variables\": $UPDATED_ENV}" > api_env.json
          
          # 更新 Lambda 配置
          aws lambda update-function-configuration \
            --function-name resort-data-api \
            --environment file://api_env.json \
            --region ${{ env.AWS_REGION }}
          
          rm api_env.json
          
          echo "✅ API Lambda 环境变量更新完成"

      - name: Upload Collector Lambda to S3
        run: |
          echo "☁️ 上传 Collector Lambda 到 S3..."
          
          BUCKET="resort-data-lambda-artifacts-579866932024"
          
          echo "📦 使用 S3 Bucket: $BUCKET"
          
          # 上传到 S3
          aws s3 cp collector-lambda.zip "s3://${BUCKET}/collector-lambda.zip" \
            --region ${{ env.AWS_REGION }}
          
          echo "✅ 上传到 S3 成功"

      - name: Deploy Collector Lambda
        run: |
          echo "🚀 部署 Collector Lambda 函数（从 S3）..."
          
          BUCKET="resort-data-lambda-artifacts-579866932024"
          
          aws lambda update-function-code \
            --function-name resort-data-collector \
            --s3-bucket "$BUCKET" \
            --s3-key "collector-lambda.zip" \
            --region ${{ env.AWS_REGION }}
          
          echo "✅ Collector Lambda 部署成功"
          
          echo "⏳ 等待 Lambda 更新完成..."
          aws lambda wait function-updated \
            --function-name resort-data-collector \
            --region ${{ env.AWS_REGION }} || true
          
          echo "🔧 更新 Collector Lambda 环境变量 (Open-Meteo API Key)..."
          
          # 获取现有环境变量
          EXISTING_ENV=$(aws lambda get-function-configuration \
            --function-name resort-data-collector \
            --region ${{ env.AWS_REGION }} \
            --query 'Environment.Variables' \
            --output json)
          
          echo "现有环境变量: $EXISTING_ENV"
          
          # 使用 jq 添加 OPENMETEO_API_KEY
          UPDATED_ENV=$(echo "$EXISTING_ENV" | jq '. + {"OPENMETEO_API_KEY": "${{ secrets.OPENMETEO_API_KEY }}"}')
          
          echo "更新后的环境变量: $UPDATED_ENV"
          
          # 写入临时文件
          echo "{\"Variables\": $UPDATED_ENV}" > collector_env.json
          
          # 更新 Lambda 配置
          aws lambda update-function-configuration \
            --function-name resort-data-collector \
            --environment file://collector_env.json \
            --region ${{ env.AWS_REGION }}
          
          rm collector_env.json
          
          echo "✅ Collector Lambda 环境变量更新完成"

      - name: Build Contact Collector Lambda
        run: |
          echo "📦 构建 Contact Collector Lambda 包..."
          
          # 创建临时目录
          mkdir -p package-contact
          
          # 安装依赖
          pip install -r requirements.txt -t package-contact/ --upgrade
          
          # 复制基础代码文件
          cp config.py db_manager.py models.py normalizer.py failure_tracker.py package-contact/
          cp resorts_config.json package-contact/
          
          # 复制 collectors 目录
          cp -r collectors package-contact/
          
          # 直接复制现有的 handler 文件（不再重新生成）
          cp contact_collector_handler.py package-contact/
          
          # 创建部署包
          cd package-contact
          zip -r ../contact-collector-lambda.zip .
          cd ..
          
          echo "✅ Contact Collector Lambda 包构建完成"
          ls -lh contact-collector-lambda.zip
          
          # 验证包内容
          echo "📋 验证部署包内容..."
          unzip -l contact-collector-lambda.zip | grep -E "(contact_collector_handler|collectors|db_manager)" || echo "Warning: missing files"

      - name: Upload Contact Collector Lambda to S3
        run: |
          echo "☁️ 上传 Contact Collector Lambda 到 S3..."
          
          BUCKET="resort-data-lambda-artifacts-579866932024"
          
          aws s3 cp contact-collector-lambda.zip "s3://${BUCKET}/contact-collector-lambda.zip" \
            --region ${{ env.AWS_REGION }}
          
          echo "✅ 上传到 S3 成功"

      - name: Deploy Contact Collector Lambda
        run: |
          echo "🚀 部署 Contact Collector Lambda 函数（从 S3）..."
          
          BUCKET="resort-data-lambda-artifacts-579866932024"
          
          aws lambda update-function-code \
            --function-name resort-data-contact-collector \
            --s3-bucket "$BUCKET" \
            --s3-key "contact-collector-lambda.zip" \
            --region ${{ env.AWS_REGION }}
          
          echo "✅ Contact Collector Lambda 部署成功"
          
          echo "⏳ 等待 Lambda 更新完成..."
          aws lambda wait function-updated \
            --function-name resort-data-contact-collector \
            --region ${{ env.AWS_REGION }} || true
          
          echo "🔧 更新 Contact Collector Lambda 环境变量 (Google Maps API Key)..."
          
          # 获取现有环境变量
          EXISTING_ENV=$(aws lambda get-function-configuration \
            --function-name resort-data-contact-collector \
            --region ${{ env.AWS_REGION }} \
            --query 'Environment.Variables' \
            --output json)
          
          echo "现有环境变量: $EXISTING_ENV"
          
          # 使用 jq 添加 GOOGLE_MAPS_API_KEY
          UPDATED_ENV=$(echo "$EXISTING_ENV" | jq '. + {"GOOGLE_MAPS_API_KEY": "${{ secrets.GOOGLE_MAPS_API_KEY }}"}')
          
          echo "更新后的环境变量: $UPDATED_ENV"
          
          # 写入临时文件
          echo "{\"Variables\": $UPDATED_ENV}" > contact_env.json
          
          # 更新 Lambda 配置
          aws lambda update-function-configuration \
            --function-name resort-data-contact-collector \
            --environment file://contact_env.json \
            --region ${{ env.AWS_REGION }}
          
          rm contact_env.json
          
          echo "✅ Contact Collector Lambda 环境变量更新完成"

      - name: Build Snow Checker Lambda
        run: |
          echo "📦 构建 Snow Checker Lambda 包..."
          
          # 创建临时目录
          mkdir -p package-snow
          
          # 复制代码
          cp check_snow_and_notify.py push_service.py package-snow/
          
          # 安装依赖
          pip install -r requirements.txt -t package-snow/ --upgrade
          
          # 创建部署包
          cd package-snow
          zip -r ../snow-checker.zip .
          cd ..
          
          echo "✅ Snow Checker Lambda 包构建完成"
          ls -lh snow-checker.zip

      - name: Build SQS Notification Processor Lambda
        run: |
          echo "📦 构建 SQS Notification Processor Lambda 包..."
          
          mkdir -p package-sqs
          cp sqs_notification_processor.py push_service.py package-sqs/
          # 用约束文件强制 cryptography==38.0.4，防止 firebase-admin 等依赖拉取带 Rust 的新版（Lambda 仅 GLIBC 2.26）
          pip install -r requirements-lambda.txt -t package-sqs/ -c lambda-constraints.txt --upgrade --force-reinstall --no-cache-dir
          
          cd package-sqs
          zip -r ../sqs-notification-processor.zip .
          cd ..
          
          echo "✅ SQS Notification Processor Lambda 包构建完成"
          ls -lh sqs-notification-processor.zip
          echo "📌 验证 cryptography 版本（应为 38.0.4，无 _rust）："
          ls package-sqs/cryptography/hazmat/bindings/ 2>/dev/null || true

      - name: Upload Snow Checker Lambda to S3
        run: |
          echo "☁️ 上传 Snow Checker Lambda 到 S3..."
          
          BUCKET="resort-data-lambda-artifacts-579866932024"
          
          aws s3 cp snow-checker.zip "s3://${BUCKET}/snow-checker.zip" \
            --region ${{ env.AWS_REGION }}
          
          echo "✅ 上传到 S3 成功"

      - name: Deploy Snow Checker Lambda
        run: |
          echo "🚀 部署 Snow Checker Lambda 函数（从 S3）..."
          
          BUCKET="resort-data-lambda-artifacts-579866932024"
          
          aws lambda update-function-code \
            --function-name resort-data-snow-checker \
            --s3-bucket "$BUCKET" \
            --s3-key "snow-checker.zip" \
            --region ${{ env.AWS_REGION }}
          
          echo "✅ Snow Checker Lambda 部署成功"
          echo "⏳ 等待 Lambda 更新完成..."
          sleep 10

      - name: Upload SQS Notification Processor Lambda to S3
        run: |
          echo "☁️ 上传 SQS Notification Processor Lambda 到 S3..."
          
          BUCKET="resort-data-lambda-artifacts-579866932024"
          
          aws s3 cp sqs-notification-processor.zip "s3://${BUCKET}/sqs-notification-processor.zip" \
            --region ${{ env.AWS_REGION }}
          
          echo "✅ 上传到 S3 成功"

      - name: Deploy SQS Notification Processor Lambda (Dev)
        run: |
          echo "🚀 部署 SQS Notification Processor Lambda 函数 (Dev) （从 S3）..."
          
          BUCKET="resort-data-lambda-artifacts-579866932024"
          
          aws lambda update-function-code \
            --function-name resort-data-sqs-notification-processor \
            --s3-bucket "$BUCKET" \
            --s3-key "sqs-notification-processor.zip" \
            --region ${{ env.AWS_REGION }}
          
          echo "✅ SQS Notification Processor Lambda (Dev) 部署成功"

      - name: Deploy SQS Notification Processor Lambda (Prod)
        run: |
          echo "🚀 部署 SQS Notification Processor Lambda 函数 (Prod) （从 S3）..."
          
          BUCKET="resort-data-lambda-artifacts-579866932024"
          
          aws lambda update-function-code \
            --function-name resort-data-prod-notification-processor \
            --s3-bucket "$BUCKET" \
            --s3-key "sqs-notification-processor.zip" \
            --region ${{ env.AWS_REGION }}
          
          echo "✅ SQS Notification Processor Lambda (Prod) 部署成功"

      - name: Update Lambda Environment Variables
        run: |
          echo "🔧 更新 Lambda 环境变量（Firebase 配置）..."
          
          # 等待所有 Lambda 函数更新完成
          echo "⏳ 等待所有 Lambda 函数就绪..."
          aws lambda wait function-updated \
            --function-name resort-data-snow-checker \
            --region ${{ env.AWS_REGION }} || true
          
          aws lambda wait function-updated \
            --function-name resort-data-sqs-notification-processor \
            --region ${{ env.AWS_REGION }} || true
          
          aws lambda wait function-updated \
            --function-name resort-data-prod-notification-processor \
            --region ${{ env.AWS_REGION }} || true
          
          echo "✅ 所有 Lambda 函数已就绪"
          
          # 更新 Snow Checker 环境变量
          echo "🔧 更新 Snow Checker 环境变量..."
          
          # 使用 jq 构建 JSON，正确处理换行符
          jq -n \
            --arg db_host "${{ secrets.DB_HOST }}" \
            --arg db_name "${{ secrets.DB_NAME }}" \
            --arg db_user "${{ secrets.DB_USER }}" \
            --arg db_password "${{ secrets.DB_PASSWORD }}" \
            --arg redis_host "${{ secrets.REDIS_HOST }}" \
            --arg redis_port "${{ secrets.REDIS_PORT }}" \
            --arg firebase_project "${{ secrets.FIREBASE_PROJECT_ID }}" \
            --arg firebase_key_id "${{ secrets.FIREBASE_PRIVATE_KEY_ID }}" \
            --arg firebase_key "${{ secrets.FIREBASE_PRIVATE_KEY }}" \
            --arg firebase_email "${{ secrets.FIREBASE_CLIENT_EMAIL }}" \
            --arg firebase_client_id "${{ secrets.FIREBASE_CLIENT_ID }}" \
            '{
              Variables: {
                DB_HOST: $db_host,
                DB_NAME: $db_name,
                DB_USER: $db_user,
                DB_PASSWORD: $db_password,
                REDIS_HOST: $redis_host,
                REDIS_PORT: $redis_port,
                FIREBASE_PROJECT_ID: $firebase_project,
                FIREBASE_PRIVATE_KEY_ID: $firebase_key_id,
                FIREBASE_PRIVATE_KEY: $firebase_key,
                FIREBASE_CLIENT_EMAIL: $firebase_email,
                FIREBASE_CLIENT_ID: $firebase_client_id
              }
            }' > env_snow_final.json
          
          aws lambda update-function-configuration \
            --function-name resort-data-snow-checker \
            --environment file://env_snow_final.json \
            --region ${{ env.AWS_REGION }}
          
          rm env_snow_final.json
          
          echo "✅ Snow Checker 环境变量更新完成"
          echo "⏳ 等待更新完成..."
          sleep 5
          
          # 更新 SQS Notification Processor 环境变量
          echo "🔧 更新 SQS Notification Processor (Dev) 环境变量..."
          
          # 使用 jq 构建 JSON，正确处理换行符
          jq -n \
            --arg supabase_url "${{ secrets.SUPABASE_URL }}" \
            --arg supabase_key "${{ secrets.SUPABASE_SERVICE_KEY }}" \
            --arg firebase_project "${{ secrets.FIREBASE_PROJECT_ID }}" \
            --arg firebase_key_id "${{ secrets.FIREBASE_PRIVATE_KEY_ID }}" \
            --arg firebase_key "${{ secrets.FIREBASE_PRIVATE_KEY }}" \
            --arg firebase_email "${{ secrets.FIREBASE_CLIENT_EMAIL }}" \
            --arg firebase_client_id "${{ secrets.FIREBASE_CLIENT_ID }}" \
            '{
              Variables: {
                SUPABASE_URL: $supabase_url,
                SUPABASE_SERVICE_KEY: $supabase_key,
                FIREBASE_PROJECT_ID: $firebase_project,
                FIREBASE_PRIVATE_KEY_ID: $firebase_key_id,
                FIREBASE_PRIVATE_KEY: $firebase_key,
                FIREBASE_CLIENT_EMAIL: $firebase_email,
                FIREBASE_CLIENT_ID: $firebase_client_id
              }
            }' > env_dev_sqs.json
          
          aws lambda update-function-configuration \
            --function-name resort-data-sqs-notification-processor \
            --environment file://env_dev_sqs.json \
            --region ${{ env.AWS_REGION }}
          
          rm env_dev_sqs.json
          
          echo "✅ SQS Notification Processor (Dev) 环境变量更新完成"
          echo "⏳ 等待更新完成..."
          sleep 5
          
          # 更新 SQS Notification Processor Prod 环境变量
          echo "🔧 更新 SQS Notification Processor (Prod) 环境变量..."
          
          # 使用 jq 构建 JSON，正确处理换行符
          jq -n \
            --arg supabase_url "${{ secrets.PROD_SUPABASE_URL }}" \
            --arg supabase_key "${{ secrets.PROD_SUPABASE_SERVICE_KEY }}" \
            --arg firebase_project "${{ secrets.FIREBASE_PROJECT_ID }}" \
            --arg firebase_key_id "${{ secrets.FIREBASE_PRIVATE_KEY_ID }}" \
            --arg firebase_key "${{ secrets.FIREBASE_PRIVATE_KEY }}" \
            --arg firebase_email "${{ secrets.FIREBASE_CLIENT_EMAIL }}" \
            --arg firebase_client_id "${{ secrets.FIREBASE_CLIENT_ID }}" \
            '{
              Variables: {
                SUPABASE_URL: $supabase_url,
                SUPABASE_SERVICE_KEY: $supabase_key,
                FIREBASE_PROJECT_ID: $firebase_project,
                FIREBASE_PRIVATE_KEY_ID: $firebase_key_id,
                FIREBASE_PRIVATE_KEY: $firebase_key,
                FIREBASE_CLIENT_EMAIL: $firebase_email,
                FIREBASE_CLIENT_ID: $firebase_client_id,
                BATCH_SIZE: "10"
              }
            }' > env_prod_sqs.json
          
          aws lambda update-function-configuration \
            --function-name resort-data-prod-notification-processor \
            --environment file://env_prod_sqs.json \
            --region ${{ env.AWS_REGION }}
          
          rm env_prod_sqs.json
          
          echo "✅ 所有环境变量更新成功"

      - name: Trigger Initial Data Collection
        run: |
          echo "🎯 触发一次数据采集..."
          
          # 等待 Collector Lambda 更新完成
          aws lambda wait function-updated \
            --function-name resort-data-collector \
            --region ${{ env.AWS_REGION }} || true
          
          # 调用 Collector Lambda
          aws lambda invoke \
            --function-name resort-data-collector \
            --invocation-type Event \
            --region ${{ env.AWS_REGION }} \
            response.json
          
          echo "✅ 数据采集任务已启动（异步执行）"
          echo "📊 查看采集日志:"
          echo "   AWS Console → CloudWatch Logs → /aws/lambda/resort-data-collector"

      - name: Deployment Summary
        run: |
          echo ""
          echo "═══════════════════════════════════════"
          echo "✅ Lambda 函数部署完成！"
          echo "═══════════════════════════════════════"
          echo ""
          echo "📡 API 访问地址:"
          echo "   https://api.steponsnow.com/api/resorts"
          echo ""
          echo "🎯 数据采集:"
          echo "   ✅ 部署后自动触发了一次数据采集"
          echo "   ⏰ 定时任务: 每3小时自动采集"
          echo ""
          echo "🔧 验证部署:"
          echo "   curl https://api.steponsnow.com/api/status"
          echo ""
          echo "📊 查看日志:"
          echo "   AWS Console → CloudWatch Logs"
          echo "   - /aws/lambda/resort-data-api"
          echo "   - /aws/lambda/resort-data-collector"
          echo "   - /aws/lambda/resort-data-sqs-notification-processor"
          echo "   - /aws/lambda/resort-data-prod-notification-processor"
          echo "   - /aws/lambda/resort-data-snow-checker"
          echo ""
          echo "🔔 推送通知:"
          echo "   - SQS Notification Processor (Dev/Prod): DB 触发器 → Lambda Function URL"
          echo "   - Snow Checker: 每小时检查降雪"
          echo ""
          echo "═══════════════════════════════════════"
